<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container-fluid">
    <a class="navbar-brand" href="{{ '/' | relative_url }}">
      <img src="{{ site.logo | relative_url }}" height="50" alt="{{ site.title }}">
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        {% for item in site.data.navigation %}
        {% assign is_active = false %}
        {% if item.url == "/" and page.url == "/" %}{% assign is_active = true %}
        {% elsif item.url != "/" and page.url contains item.url %}{% assign is_active = true %}{% endif %}
        <li class="nav-item">
          <a class="nav-link{% if is_active %} active{% endif %}" href="{{ item.url | relative_url }}">{{ item.title }}</a>
        </li>
        {% endfor %}
      </ul>
    </div>
  </div>
</nav>
